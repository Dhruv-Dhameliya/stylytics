<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Editor — Stylytics</title>
  <link rel="stylesheet" href="stylytics.css">
  <link rel="stylesheet" href="editor.css">
</head>

<body>
  <div class="editor-header">
    <span class="tile-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </span>
    <h1>Screenshot Editor</h1>

    <div class="editor-header-spacer"></div>

    <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M9 14 4 9l5-5"></path>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path>
      </svg>
    </button>
    <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M15 14l5-5-5-5"></path>
        <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path>
      </svg>
    </button>

    <div class="editor-header-divider"></div>

    <select id="download-format" class="mini-action editor-header-select" title="Export format">
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
      <option value="pdf">PDF</option>
    </select>
    <button id="copy-btn" class="footer-action" style="width: auto; margin-top: 0;" title="Copy to clipboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Copy
    </button>
    <button id="download-btn" class="footer-action primary" style="width: auto; margin-top: 0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <path d="M7 10l5 5 5-5"></path>
        <path d="M12 15V3"></path>
      </svg>
      Download
    </button>
  </div>

  <div class="editor-toolbar" id="editor-toolbar">
    <div class="segmented" id="tool-toggle">
      <button class="tag tool-btn" data-tool="select" title="Select / Move (V)">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
          <path d="M4 3l6.5 16 2-6.5L19 10.5z"></path>
        </svg>
      </button>
      <button class="tag tool-btn active" data-tool="arrow" title="Arrow (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="19" x2="19" y2="5"></line>
          <polyline points="9 5 19 5 19 15"></polyline>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="line" title="Straight line (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="19" x2="19" y2="5"></line>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="rect" title="Rectangle outline (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="6" width="16" height="12" rx="2"></rect>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="ellipse" title="Ellipse outline (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="12" rx="8" ry="6"></ellipse>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="pen" title="Freehand pen (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c2-6 4-9 6-9s2 5 4 5 2-8 4-8 2 7 4 7"></path>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="highlight" title="Highlight a region (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 15 15 4"></path>
          <rect x="3" y="15" width="18" height="5" rx="1"></rect>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="text" title="Add a text label (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5h14"></path>
          <path d="M12 5v14"></path>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="blur" title="Blur / redact a region (B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="crop" title="Crop (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
          <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
        </svg>
      </button>
      <button class="tag tool-btn" data-tool="eyedropper" title="Eyedropper — pick a color from the image (I)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 22 1-4 9.5-9.5"></path>
          <path d="M13.5 8.5 17 5"></path>
          <path d="M18.5 3.5a2.12 2.12 0 0 1 3 3L19 9l-3-3Z"></path>
        </svg>
      </button>
    </div>

    <input type="color" id="annotation-color" value="#ef4444" title="Annotation color">

    <div class="segmented" id="stroke-width-toggle" title="Stroke width">
      <button class="tag" data-width="2">Thin</button>
      <button class="tag active" data-width="4">Medium</button>
      <button class="tag" data-width="8">Thick</button>
    </div>

    <div class="segmented hidden" id="crop-actions">
      <button class="tag" id="crop-cancel-btn" title="Cancel crop (Esc)">Cancel</button>
      <button class="tag" id="crop-apply-btn" title="Apply crop (Enter)">Apply Crop</button>
    </div>
  </div>

  <div class="editor-canvas-area" id="editor-canvas-area">
    <div id="editor-empty" class="inspect-empty hidden">
      <div class="inspect-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <p class="inspect-empty-title">No screenshot to edit</p>
      <p class="inspect-hint">Capture one from the Stylytics side panel first, then click Edit.</p>
    </div>
    <div id="editor-canvas-wrap" class="editor-canvas-wrap hidden">
      <canvas id="editor-canvas"></canvas>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="screenshot-shared.js"></script>
  <script src="editor.js"></script>
</body>

</html>
